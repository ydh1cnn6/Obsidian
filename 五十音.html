<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五十音图 — KanjiVG 笔顺</title>
<style>
  :root {
    --bg-page:    #f4f2ee;
    --bg-card:    #ffffff;
    --bg-stage:   #fcfbf9;
    --bg-soft:    #f0eeea;
    --bg-cell:    #ffffff;
    --bg-cell-h:  #faf9f7;
    --bg-active:  #fffaf8;
    --border:     #ece8e0;
    --border-h:   #ddd8ce;
    --grid-line:  #ddd8ce;
    --grid-dash:  #ece8e0;
    --text:       #2b2b2b;
    --text-2:     #4a463f;
    --text-3:     #7a756e;
    --text-4:     #a8a29a;
    --text-5:     #b8b2a8;
    --accent:     #c8553d;
    --accent-h:   #b84a34;
    --shadow-card: 0 8px 32px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
    --shadow-modal: 0 20px 60px rgba(0,0,0,.24);
  }

  /* Obsidian 暗色主题下自动切换 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page:    #1e1e1e;
      --bg-card:    #262626;
      --bg-stage:   #1a1a1a;
      --bg-soft:    #2f2f2f;
      --bg-cell:    #2a2a2a;
      --bg-cell-h:  #333333;
      --bg-active:  #3a2823;
      --border:     #3a3a3a;
      --border-h:   #4a4a4a;
      --grid-line:  #3a3a3a;
      --grid-dash:  #303030;
      --text:       #e0e0e0;
      --text-2:     #c8c8c8;
      --text-3:     #9a9a9a;
      --text-4:     #7a7a7a;
      --text-5:     #666666;
      --shadow-card: 0 8px 32px rgba(0,0,0,.4);
      --shadow-modal: 0 20px 60px rgba(0,0,0,.6);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP",
                 "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    padding: 12px;
  }

  .app {
    width: min(520px, 100%);
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow-card);
  }

  .app h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 12px;
    color: var(--text);
    letter-spacing: .02em;
  }

  .tabs {
    display: flex; gap: 6px;
    background: var(--bg-soft); padding: 4px; border-radius: 12px;
    margin-bottom: 8px;
  }
  .tab {
    flex: 1; border: 0; background: transparent;
    padding: 8px; border-radius: 9px;
    font-size: 13px; font-family: inherit;
    color: var(--text-3); cursor: pointer; transition: all .18s;
  }
  .tab.active {
    background: var(--bg-card); color: var(--text);
    font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .tabs.sub .tab { font-size: 12px; padding: 7px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    margin-top: 12px;
  }

  .cell {
    border: 1px solid var(--border);
    background: var(--bg-cell);
    border-radius: 9px;
    padding: 6px 2px 5px;
    min-height: 54px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    transition: all .15s;
  }
  .cell:hover  { background: var(--bg-cell-h); border-color: var(--border-h); }
  .cell:active { transform: scale(.96); }
  .cell.empty  { visibility: hidden; pointer-events: none; }
  .cell.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(200,85,61,.22);
    background: var(--bg-active);
  }

  .cell .kana {
    font-size: 20px;
    line-height: 1.1;
    font-weight: 500;
  }
  .cell .romaji {
    font-size: 12px;
    color: var(--text-3);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .02em;
    font-weight: 600;
  }

  .footer {
    margin-top: 14px;
    font-size: 10px;
    color: var(--text-5);
    text-align: center;
    line-height: 1.6;
  }
  .footer a {
    color: var(--text-4);
    text-decoration: none;
    border-bottom: 1px dotted var(--grid-line);
  }

  /* ---------- 模态框 ---------- */
  .modal {
    position: fixed; inset: 0;
    z-index: 100;
    display: grid; place-items: center;
    padding: 16px;
  }
  .modal[hidden] { display: none; }

  .modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, .5);
    backdrop-filter: blur(2px);
    animation: fadeIn .18s ease;
  }

  .modal-panel {
    position: relative;
    width: min(360px, 100%);
    background: var(--bg-card);
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow-modal);
    animation: popIn .22s cubic-bezier(.33,1.4,.5,1);
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.92); }
    to   { opacity: 1; transform: scale(1); }
  }

  .modal-close {
    position: absolute;
    top: 10px; right: 10px;
    width: 28px; height: 28px;
    border: 0; background: var(--bg-soft);
    border-radius: 50%;
    font-size: 13px;
    color: var(--text-3);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all .15s;
    z-index: 2;
  }
  .modal-close:hover { background: var(--border); color: var(--text); }

  .stage {
    position: relative;
    aspect-ratio: 1;
    background: var(--bg-stage);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .grid-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .grid-bg rect { fill: none; stroke: var(--grid-line); stroke-width: 1.5; }
  .grid-bg line {
    stroke: var(--grid-dash); stroke-width: 1;
    stroke-dasharray: 5 5;
  }

  .stage > svg.kanji-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  .stage > svg.kanji-svg path {
    fill: none;
    stroke-width: 4.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* KanjiVG 原生序号：保持灰色小字，暗色下加深一点对比 */
  .stage > svg.kanji-svg text {
    fill: var(--text-4);
  }

  .stage-loading {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--text-4); font-size: 12px;
    background: var(--bg-stage);
    z-index: 2;
  }
  .stage-loading[hidden] { display: none; }

  .detail-head {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 12px;
    padding: 0 2px;
  }

  .char-pair {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .char-btn {
    border: 0;
    background: none;
    font-family: inherit;
    cursor: pointer;
    padding: 4px 7px;
    border-radius: 10px;
    transition: all .15s;
    line-height: 1;
    font-size: 22px;
    font-weight: 500;
    color: var(--text-5);
  }
  .char-btn:hover:not(.active-char) {
    background: var(--bg-soft);
    color: var(--text-3);
  }
  .char-btn.active-char {
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    background: var(--bg-soft);
  }

  .meta {
    margin-left: auto;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .meta .romaji {
    font-size: 16px;
    color: var(--text-3);
    font-weight: 500;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .02em;
  }
  .meta .stroke-badge {
    font-size: 11px;
    color: var(--text-3);
    background: var(--bg-soft);
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .actions { display: flex; gap: 5px; }
  .btn {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg-card);
    padding: 9px 6px;
    border-radius: 9px;
    font-size: 12px;
    font-family: inherit;
    color: var(--text-2);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .btn:hover  { background: var(--bg-soft); border-color: var(--border-h); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .btn.primary {
    flex: 1.4;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn.primary:hover { background: var(--accent-h); }

  .hint {
    margin: 8px 0 0;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-4);
    text-align: center;
    min-height: 1.5em;
  }
</style>
</head>
<body>

<main class="app">
  <h1>五十音図</h1>

  <div class="tabs" id="scriptTabs">
    <button class="tab active" data-script="hiragana">平假名</button>
    <button class="tab" data-script="katakana">片假名</button>
  </div>

  <div class="tabs sub" id="kindTabs">
    <button class="tab active" data-kind="seion">清音</button>
    <button class="tab" data-kind="dakuon">浊音 / 半浊音</button>
  </div>

  <div class="grid" id="grid"></div>

  <p class="footer">
    笔画数据来自 <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>（CC BY-SA 3.0，© Ulrich Apel）
  </p>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-panel" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>

    <div class="stage" id="stage">
      <svg class="grid-bg" viewBox="0 0 109 109" preserveAspectRatio="xMidYMid meet">
        <rect x="2" y="2" width="105" height="105" rx="1"/>
        <line x1="54.5" y1="2" x2="54.5" y2="107"/>
        <line x1="2" y1="54.5" x2="107" y2="54.5"/>
      </svg>
      <div class="stage-loading" id="stageLoading">加载中…</div>
    </div>

    <div class="detail-head">
      <div class="char-pair">
        <button class="char-btn" id="mCharHira" type="button">—</button>
        <button class="char-btn" id="mCharKata" type="button">—</button>
      </div>
      <div class="meta">
        <span class="romaji" id="mRomaji">—</span>
        <span class="stroke-badge" id="mStroke">— 画</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnPlay">▶ 播放笔顺</button>
      <button class="btn" id="btnSpeak">🔊 发音</button>
      <button class="btn" id="btnReset">↺ 重置</button>
    </div>

    <p class="hint" id="hint"></p>
  </div>
</div>

<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));

const ROWS = {
  seion: [
    ['あ','ア','a'], ['い','イ','i'], ['う','ウ','u'], ['え','エ','e'], ['お','オ','o'],
    ['か','カ','ka'], ['き','キ','ki'], ['く','ク','ku'], ['け','ケ','ke'], ['こ','コ','ko'],
    ['さ','サ','sa'], ['し','シ','shi'], ['す','ス','su'], ['せ','セ','se'], ['そ','ソ','so'],
    ['た','タ','ta'], ['ち','チ','chi'], ['つ','ツ','tsu'], ['て','テ','te'], ['と','ト','to'],
    ['な','ナ','na'], ['に','ニ','ni'], ['ぬ','ヌ','nu'], ['ね','ネ','ne'], ['の','ノ','no'],
    ['は','ハ','ha'], ['ひ','ヒ','hi'], ['ふ','フ','fu'], ['へ','ヘ','he'], ['ほ','ホ','ho'],
    ['ま','マ','ma'], ['み','ミ','mi'], ['む','ム','mu'], ['め','メ','me'], ['も','モ','mo'],
    ['や','ヤ','ya'], [null,null,null], ['ゆ','ユ','yu'], [null,null,null], ['よ','ヨ','yo'],
    ['ら','ラ','ra'], ['り','リ','ri'], ['る','ル','ru'], ['れ','レ','re'], ['ろ','ロ','ro'],
    ['わ','ワ','wa'], [null,null,null], [null,null,null], [null,null,null], ['を','ヲ','wo'],
    ['ん','ン','n'], [null,null,null], [null,null,null], [null,null,null], [null,null,null]
  ],
  dakuon: [
    ['が','ガ','ga'], ['ぎ','ギ','gi'], ['ぐ','グ','gu'], ['げ','ゲ','ge'], ['ご','ゴ','go'],
    ['ざ','ザ','za'], ['じ','ジ','ji'], ['ず','ズ','zu'], ['ぜ','ゼ','ze'], ['ぞ','ゾ','zo'],
    ['だ','ダ','da'], ['ぢ','ヂ','ji'], ['づ','ヅ','zu'], ['で','デ','de'], ['ど','ド','do'],
    ['ば','バ','ba'], ['び','ビ','bi'], ['ぶ','ブ','bu'], ['べ','ベ','be'], ['ぼ','ボ','bo'],
    ['ぱ','パ','pa'], ['ぴ','ピ','pi'], ['ぷ','プ','pu'], ['ぺ','ペ','pe'], ['ぽ','ポ','po']
  ]
};

const SCRIPT_INDEX = { hiragana: 0, katakana: 1 };
const CDN = 'https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji';
const PALETTE = ['#a05195', '#2e7d32', '#c8553d', '#1976d2', '#e08a00', '#7b5e57'];
const svgTextCache = new Map();

let currentScript = 'hiragana';
let currentKind   = 'seion';
let currentRow    = null;
let modalScript   = 'hiragana';
let svgEl         = null;
let strokePaths   = [];
let playing       = false;
let playToken     = 0;
let modalToken    = 0;

/* ---------- 发音 ---------- */
let jaVoice = null;
function initVoices() {
  if (!('speechSynthesis' in window)) return;
  const list = speechSynthesis.getVoices();
  if (!list.length) return;
  jaVoice =
    list.find(v => v.lang.replace('_','-').toLowerCase() === 'ja-jp') ||
    list.find(v => v.lang.toLowerCase().startsWith('ja')) || null;
}
function speak(text) {
  if (!('speechSynthesis' in window)) { setHint('当前浏览器不支持语音合成'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = 0.7; u.pitch = 1;
  if (jaVoice) u.voice = jaVoice;
  speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) {
  initVoices();
  speechSynthesis.addEventListener('voiceschanged', initVoices);
}

/* ---------- 网格 ---------- */
const gridEl = document.getElementById('grid');
function renderGrid() {
  gridEl.innerHTML = '';
  const col = SCRIPT_INDEX[currentScript];
  const rows = ROWS[currentKind];

  rows.forEach((row) => {
    const char = row[col];
    const romaji = row[2];
    const btn = document.createElement('button');
    btn.className = 'cell';
    btn.type = 'button';
    if (!char) {
      btn.classList.add('empty');
      btn.disabled = true;
    } else {
      btn.innerHTML = `<span class="kana">${char}</span><span class="romaji">${romaji}</span>`;
      btn.addEventListener('click', () => openKana(row, btn));
      btn.dataset.char = char;
    }
    gridEl.appendChild(btn);
  });
}

/* ---------- 加载 ---------- */
async function fetchSvgText(char) {
  if (svgTextCache.has(char)) return svgTextCache.get(char);
  const code = char.codePointAt(0).toString(16).padStart(5, '0');
  const url = `${CDN}/${code}.svg`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  svgTextCache.set(char, text);
  return text;
}

function parseSvg(text) {
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const svg = doc.querySelector('svg');
  if (!svg) throw new Error('无效的 SVG');
  if (!svg.getAttribute('viewBox')) svg.setAttribute('viewBox', '0 0 109 109');
  svg.querySelectorAll('g').forEach(g => {
    if (g.id && g.id.includes('StrokeNumbers')) return;
    g.removeAttribute('style');
  });
  return svg;
}

/* ---------- 模态框 ---------- */
const modal         = document.getElementById('modal');
const modalClose    = document.getElementById('modalClose');
const modalBackdrop = document.getElementById('modalBackdrop');
const stage         = document.getElementById('stage');
const stageLoading  = document.getElementById('stageLoading');
const mCharHira     = document.getElementById('mCharHira');
const mCharKata     = document.getElementById('mCharKata');
const mRomaji       = document.getElementById('mRomaji');
const mStroke       = document.getElementById('mStroke');
const hintEl        = document.getElementById('hint');
const btnPlay       = document.getElementById('btnPlay');
const btnSpeak      = document.getElementById('btnSpeak');
const btnReset      = document.getElementById('btnReset');

function setHint(msg) { hintEl.textContent = msg; }

async function openKana(row, cellEl) {
  document.querySelectorAll('.cell.active').forEach(c => c.classList.remove('active'));
  if (cellEl) cellEl.classList.add('active');
  currentRow = row;
  modalScript = currentScript;
  modal.hidden = false;
  await renderModal({ autoplay: true });
}

async function renderModal(opts = {}) {
  const { autoplay = false } = opts;
  if (!currentRow) return;

  const [hira, kata, romaji] = currentRow;
  const token = ++modalToken;

  mCharHira.textContent = hira;
  mCharKata.textContent = kata;
  mCharHira.classList.toggle('active-char', modalScript === 'hiragana');
  mCharKata.classList.toggle('active-char', modalScript === 'katakana');
  mRomaji.textContent = romaji;
  mStroke.textContent = '…';
  setHint('');

  stage.querySelectorAll('svg.kanji-svg').forEach(s => s.remove());
  stageLoading.hidden = false;
  stageLoading.textContent = '加载中…';
  cancelPlay();

  const targetChar = modalScript === 'hiragana' ? hira : kata;

  let svg;
  try {
    const text = await fetchSvgText(targetChar);
    if (token !== modalToken) return;
    svg = parseSvg(text);
  } catch (e) {
    if (token !== modalToken) return;
    stageLoading.textContent = `加载失败：${e.message}`;
    return;
  }
  if (token !== modalToken) return;

  svg.classList.add('kanji-svg');
  stage.appendChild(svg);
  svgEl = svg;
  stageLoading.hidden = true;

  strokePaths = Array.from(svg.querySelectorAll('path'));
  strokePaths.forEach((p, i) => { p.style.stroke = PALETTE[i % PALETTE.length]; });

  mStroke.textContent = strokePaths.length + ' 画';

  resetAll();
  if (autoplay) await play();
}

function closeModal() {
  modal.hidden = true;
  cancelPlay();
  stage.querySelectorAll('svg.kanji-svg').forEach(s => s.remove());
  strokePaths = [];
  svgEl = null;
  currentRow = null;
  document.querySelectorAll('.cell.active').forEach(c => c.classList.remove('active'));
}

/* ---------- 动画 ---------- */
function resetAll() {
  strokePaths.forEach(p => {
    p.style.transition = 'none';
    p.style.strokeDasharray  = '';
    p.style.strokeDashoffset = '';
  });
}

async function play() {
  if (playing || !strokePaths.length) return;
  playing = true;
  const token = ++playToken;
  btnPlay.disabled = true;
  btnReset.disabled = false;

  strokePaths.forEach(p => {
    const len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray  = len;
    p.style.strokeDashoffset = len;
  });

  void svgEl.getBoundingClientRect();
  await sleep(80);
  if (token !== playToken) return;

  for (let i = 0; i < strokePaths.length; i++) {
    if (token !== playToken) return;
    const p = strokePaths[i];
    p.style.transition = 'stroke-dashoffset 620ms cubic-bezier(.33,0,.2,1)';
    p.style.strokeDashoffset = '0';
    await sleep(760);
  }

  if (token !== playToken) return;
  await sleep(260);
  if (token !== playToken) return;

  resetAll();
  playing = false;
  btnPlay.disabled = false;
}

function cancelPlay() {
  playToken++;
  playing = false;
  btnPlay.disabled = false;
  resetAll();
}

/* ---------- 事件 ---------- */
document.getElementById('scriptTabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('#scriptTabs .tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentScript = btn.dataset.script;
  closeModal();
  renderGrid();
});

document.getElementById('kindTabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('#kindTabs .tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentKind = btn.dataset.kind;
  closeModal();
  renderGrid();
});

mCharHira.addEventListener('click', () => {
  if (modalScript === 'hiragana') return;
  modalScript = 'hiragana';
  renderModal({ autoplay: false });
});
mCharKata.addEventListener('click', () => {
  if (modalScript === 'katakana') return;
  modalScript = 'katakana';
  renderModal({ autoplay: false });
});

modalClose.addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', closeModal);

/* ✅ 只在模态框打开时才响应 Esc，避免影响 Obsidian 的其他快捷键 */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modal.hidden) {
    e.stopPropagation();
    closeModal();
  }
});

btnPlay.addEventListener('click', play);
btnSpeak.addEventListener('click', () => {
  if (!currentRow) return;
  const target = modalScript === 'hiragana' ? currentRow[0] : currentRow[1];
  if (target) speak(target);
});
btnReset.addEventListener('click', cancelPlay);

renderGrid();
</script>
</body>
</html>
